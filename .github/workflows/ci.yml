name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Render tests need an adapter; without this they would silently skip and
      # report green while exercising no pixels (see `animatix_render::testing`).
      ANIMATIX_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config mesa-vulkan-drivers
      - name: Run tests
        # Serialize GPU-backed core tests; headless Vello/WGPU teardown can SIGSEGV
        # when renderer tests run concurrently on the same adapter.
        run: cargo test --workspace -- --test-threads=1

  render-smoke:
    name: Render Smoke
    runs-on: ubuntu-latest
    env:
      ANIMATIX_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        # mesa provides the lavapipe software Vulkan driver, so this job really
        # rasterizes all 42 examples instead of skipping.
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config mesa-vulkan-drivers
      - name: Render every example (non-blank frame gate)
        run: bash scripts/render_smoke.sh

  no-video:
    name: Build without FFmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Intentionally no FFmpeg system deps: the `video` feature must stay truly
      # opt-in, which is verified by building the user-facing binaries that
      # gate on it without enabling it.
      - name: Build CLI and GUI without video
        run: cargo build -p animatix-cli -p animatix-gui
      - name: Test the engine with no optional features
        run: cargo test -p animatix --lib --no-default-features -- --test-threads=1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  extension-bench:
    name: Extension Bench Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run extension benchmark gate
        run: bash scripts/extension-bench.sh --quick --max-plan-ns 10000

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check docs links and roadmap status
        run: bash scripts/check-docs.sh

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit

  examples:
    name: Example Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config
      - name: Build animatix CLI
        run: cargo build --bin animatix
      - name: Validate all examples
        run: bash scripts/check_examples.sh

  eparts-features:
    name: eparts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check eparts default surface
        run: cargo check -p eparts --all-targets
      - name: Check eparts theme-json + gallery
        run: cargo check -p eparts --features theme-json --all-targets
      - name: Test eparts default
        run: cargo test -p eparts --lib
      - name: Test eparts theme-json
        run: cargo test -p eparts --lib --features theme-json

  commit-check:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cocogitto
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cocogitto/cocogitto/main/install.sh | sh
      - name: Check commit messages
        run: cog check
