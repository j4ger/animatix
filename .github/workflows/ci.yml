name: CI

# Every check this workflow runs is a gate in scripts/ci.sh, and the job matrix is
# generated from that file (`scripts/ci.sh --list`). Adding a gate there adds it
# here — there is no list in .github/ to forget to update.
#
# The old version of this file had ten hand-written jobs and could not see the
# three checks that actually protect the site (wasm compile, site_scenes, embed
# bundle drift), because those lived in pages.yml and only ran after merge. The
# `workflows` gate now fails the build if any workflow types a cargo or scripts/
# command directly instead of calling a gate, which is what keeps it from drifting
# back.
#
# It is also callable: release.yml runs this whole matrix as its release blocker,
# so "the tag is green" and "the PR is green" are the same set of checks rather
# than a second list someone maintains next to the first.

on:
  pull_request:
  # This repo lands commits on main directly, so a PR-only trigger meant the
  # gates below ran only when someone opened a pull request — which is often
  # never. The commit gate takes the previous tip from the event to bound its
  # range; see gate_commit in scripts/ci.sh.
  push:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  ANIMATIX_COMMIT_BASE: ${{ github.event.before }}

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        # pr-stage only. The release-stage rows (dist-linux, dist-macos,
        # dist-windows) build the shippable binaries — running them here would
        # cost three full release builds on every pull request.
        run: echo "matrix=$(scripts/ci.sh --matrix pr)" >> "$GITHUB_OUTPUT"

  gate:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `commit` walks the history since the last tag; the others do not care,
          # and fetching it for all of them is cheaper than a conditional that a
          # later gate has to remember to keep in sync.
          fetch-depth: 0

      # Gates that need nix (cog, cargo-audit, the wasm32 std) get their toolchain
      # from the dev shell, so they must not install a rustup toolchain: PATH
      # order would then decide which rustc runs, and the answer differs per job.
      - name: Install Nix
        if: matrix.shell == 'nix' || matrix.shell == 'web'
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Cache Nix store
        if: matrix.shell == 'nix' || matrix.shell == 'web'
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Rust (nightly — rustfmt.toml sets unstable options)
        if: matrix.shell == 'native' && contains(matrix.setup, 'rust-nightly')
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Rust (stable)
        if: matrix.shell == 'native' && contains(matrix.setup, 'rust-stable')
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        if: matrix.shell == 'native' || matrix.shell == 'nix'
        uses: Swatinem/rust-cache@v2

      - name: Node
        if: contains(matrix.setup, 'node')
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # apt packages and the pinned wasm-bindgen CLI. The toolchain hints in the
      # setup column (rust-*, node, nix, none) are handled by the steps above and
      # are no-ops here on purpose.
      - name: Provision
        shell: bash
        env:
          SETUP: ${{ matrix.setup }}
        run: scripts/ci.sh setup $SETUP

      - name: Gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          GATE_SHELL: ${{ matrix.shell }}
        # ci.sh never enters a shell itself — devshells prepend to PATH, so an
        # outer rustc wins and the wasm gate fails looking like a code fault.
        # The matrix's shell column is what says which shell this job owes it.
        run: |
          case "$GATE_SHELL" in
            web) nix develop .#web-build --command scripts/ci.sh gate $GATE ;;
            nix) nix develop --command scripts/ci.sh gate $GATE ;;
            *)   scripts/ci.sh gate $GATE ;;
          esac
