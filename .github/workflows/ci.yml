name: CI

# Gate definitions and job matrices live in scripts/ci.sh. The PR planner
# selects registered jobs by dependency; main and release callers run the full matrix.
# CI Required collects the planner and every selected result.

on:
  pull_request:
  # This repo lands commits on main directly, so a PR-only trigger meant the
  # gates below ran only when someone opened a pull request — which is often
  # never. The commit gate takes the previous tip from the event to bound its
  # range; see gate_commit in scripts/ci.sh.
  push:
    branches: [main, feat/cloudflare-candidate-preview, feat/cloudflare-pages]
  workflow_call:
    inputs:
      checkout-ref:
        description: Commit or tag to validate
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  ANIMATIX_COMMIT_BASE: ${{ github.event.before }}
  # The hosted runners occasionally fail to fetch one store path (FlakeHub 401
  # or a partial cache.nixos response). Prefer building that path from source
  # over failing the whole gate; the binary caches still satisfy everything
  # they can.
  NIX_CONFIG: |
    fallback = true
    extra-substituters = https://cache.nixos.org/

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The changed-path filter needs the base commit, not a shallow tip.
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}
      - id: plan
        env:
          ANIMATIX_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ANIMATIX_CI_CHECKOUT_REF: ${{ inputs.checkout-ref }}
          ANIMATIX_CI_SELECTION: ${{ vars.ANIMATIX_CI_SELECTION || 'enabled' }}
        run: scripts/ci.sh gate ci-plan
      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: target/ci/


  gate:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `commit` walks the history since the last tag; the others do not care,
          # and fetching it for all of them is cheaper than a conditional that a
          # later gate has to remember to keep in sync.
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      # Nix source fallback can realize large native dependency closures; the
      # runner image's preinstalled Android/.NET/GHC toolchains are not used by
      # this project and otherwise leave the Nix build with too little disk.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/chromium
          sudo apt-get clean
          df -h /

      # Gates that need nix (cog, cargo-audit, the wasm32 std) get their toolchain
      # from the dev shell, so they must not install a rustup toolchain: PATH
      # order would then decide which rustc runs, and the answer differs per job.
      - name: Install Nix
        if: matrix.shell == 'nix' || matrix.shell == 'web' || matrix.shell == 'web-ci'
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Set up Cachix
        if: matrix.shell == 'nix' || matrix.shell == 'web' || matrix.shell == 'web-ci'
        uses: cachix/cachix-action@v17
        with:
          name: animatix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: 'nix-community'
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Rust (stable)
        if: matrix.shell == 'native' && contains(matrix.setup, 'rust-stable')
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.shell }}

      # Environment hints from the setup column (rust-*, node, nix, none) are
      # handled by the steps above; the wasm-bindgen CLI now comes from the
      # .#web-build / .#web-ci dev shells, so this is a no-op for them.
      - name: Provision
        shell: bash
        env:
          SETUP: ${{ matrix.setup }}
        run: scripts/ci.sh setup "$SETUP"

      - name: Gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          GATE_SHELL: ${{ matrix.shell }}
          ANIMATIX_GATE_TIMINGS: target/ci/timings.jsonl
        # ci.sh never enters a shell itself — devshells prepend to PATH, so an
        # outer rustc wins and the wasm gate fails looking like a code fault.
        # The matrix's shell column is what says which shell this job owes it.
        run: |
          case "$GATE_SHELL" in
            web) nix develop .#web-build --command scripts/ci.sh gate "$GATE" ;;
            web-ci) nix develop .#web-ci --command scripts/ci.sh gate "$GATE" ;;
            nix) nix develop --command scripts/ci.sh gate "$GATE" ;;
            *)   scripts/ci.sh gate "$GATE" ;;
          esac

      # Upload real files rather than the local build's target/ symlink.
      - name: Stage verified web SDK
        if: contains(matrix.gate, 'web-build')
        run: nix develop --command scripts/ci.sh gate web-artifact-stage

      - name: Upload web runtime
        if: contains(matrix.gate, 'web-build')
        uses: actions/upload-artifact@v4
        with:
          name: web-runtime
          path: target/web-runtime-artifact/
          if-no-files-found: error

      # Retain synthetic transaction frames on failure without weakening checks.
      - name: Upload web transaction failure evidence
        if: failure() && contains(matrix.gate, 'web-transactions')
        uses: actions/upload-artifact@v4
        with:
          name: web-transaction-failure
          path: target/perf/distribution-refactor/web-transactions/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser smoke evidence
        if: always() && contains(matrix.gate, 'web-smoke')
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-evidence
          path: target/web-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload gate timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.id }}
          path: |
            target/ci/timings.jsonl
            target/ci/environment-*.json
          if-no-files-found: warn

  required:
    name: CI Required
    if: ${{ always() }}
    needs: [plan, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Require every selected job
        env:
          ANIMATIX_CI_NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci.sh gate ci-result

  # Optional experimental ancestors may be skipped. Override implicit success(),
  # while requiring the aggregate CI result and respecting cancellation.
  cloudflare_candidate:
    name: Sign isolated Cloudflare candidate
    needs: required
    if: ${{ !cancelled() && needs.required.result == 'success' && github.event_name == 'push' && github.repository == 'j4ger/animatix' && github.ref == 'refs/heads/feat/cloudflare-candidate-preview' && vars.ANIMATIX_CF_CANDIDATE == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Verify this run's original Nix SDK
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_CI_RESULT: ${{ needs.required.result }}
        run: scripts/ci.sh gate cloudflare-candidate-publish
      - name: Sign candidate-only permit
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/cloudflare-permit/permit.json
      - name: Retain signed candidate for Cloudflare
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" target/cloudflare-permit/permit.sigstore.json
          candidate_tag="cf-preview-${GITHUB_SHA}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          test -z "$(git ls-remote origin "refs/tags/$candidate_tag")"
          gh release create "$candidate_tag" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Isolated preview ${GITHUB_SHA:0:12}" \
            --notes 'Candidate upload only. No production activation authorization.' \
            target/cloudflare-permit/sdk.zip target/cloudflare-permit/permit.json \
            target/cloudflare-permit/permit.sigstore.json

  cloudflare_candidate_dispatch:
    name: Dispatch isolated Cloudflare candidate
    needs: cloudflare_candidate
    if: ${{ !cancelled() && needs.cloudflare_candidate.result == 'success' && vars.ANIMATIX_CF_PREVIEW_DISPATCH == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Trigger exact-SHA candidate build after publication
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_EXPERIMENT_TOKEN: ${{ secrets.CLOUDFLARE_EXPERIMENT_TOKEN }}
        run: scripts/ci.sh gate cloudflare-candidate-dispatch
      - name: Preserve dispatch result for reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-candidate-dispatch
          path: target/cloudflare-candidate-dispatch.json
          if-no-files-found: ignore
          retention-days: 30

  cloudflare_pages:
    name: Sign Cloudflare Pages SDK
    needs: required
    if: ${{ !cancelled() && needs.required.result == 'success' && github.event_name == 'push' && github.repository == 'j4ger/animatix' && github.ref == 'refs/heads/main' && vars.ANIMATIX_CF_PAGES == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Verify this run's original Nix SDK
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_CI_RESULT: ${{ needs.required.result }}
        run: scripts/ci.sh gate cloudflare-pages-publish
      - name: Sign Pages permit
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/cloudflare-permit/permit.json
      - name: Retain signed candidate for Cloudflare
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" target/cloudflare-permit/permit.sigstore.json
          candidate_tag="cf-pages-${GITHUB_SHA}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          test -z "$(git ls-remote origin "refs/tags/$candidate_tag")"
          gh release create "$candidate_tag" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Pages candidate ${GITHUB_SHA:0:12}" \
            --notes 'Signed static build for animatix-pages; publish only through the controlled deploy/pages branch.' \
            target/cloudflare-permit/sdk.zip target/cloudflare-permit/permit.json \
            target/cloudflare-permit/permit.sigstore.json



  cloudflare_pages_release:
    name: Publish verified Pages release
    needs: cloudflare_pages
    if: ${{ !cancelled() && needs.cloudflare_pages.result == 'success' && vars.ANIMATIX_CF_PAGES_RELEASE == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: cloudflare-pages-sole-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Reconcile then publish one signed main commit
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          NEEDS_PAGES_SIGN_RESULT: ${{ needs.cloudflare_pages.result }}
        run: scripts/ci.sh gate cloudflare-pages-release
