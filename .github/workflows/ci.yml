name: CI

# Gate definitions and job matrices live in scripts/ci.sh. The PR planner
# selects registered jobs by dependency; main and release callers run them all.
# CI Required collects every selected result, including planner failures.

on:
  pull_request:
  # This repo lands commits on main directly, so a PR-only trigger meant the
  # gates below ran only when someone opened a pull request — which is often
  # never. The commit gate takes the previous tip from the event to bound its
  # range; see gate_commit in scripts/ci.sh.
  push:
    branches: [main]
  workflow_call:
    inputs:
      checkout-ref:
        description: Commit or tag to validate
        required: false
        type: string
        default: ''
      topology:
        description: Explicit experimental layout; releases retain baseline
        required: false
        type: string
        default: baseline

env:
  CARGO_TERM_COLOR: always
  ANIMATIX_COMMIT_BASE: ${{ github.event.before }}
  # The hosted runners occasionally fail to fetch one store path (FlakeHub 401
  # or a partial cache.nixos response). Prefer building that path from source
  # over failing the whole gate; the binary caches still satisfy everything
  # they can.
  NIX_CONFIG: |
    fallback = true
    extra-substituters = https://cache.nixos.org/

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      topology: ${{ steps.plan.outputs.topology }}
      shared_render_gates: ${{ steps.plan.outputs.shared_render_gates }}
      native_cli_gates: ${{ steps.plan.outputs.native_cli_gates }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The changed-path filter needs the base commit, not a shallow tip.
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.ref }}
      - id: plan
        env:
          ANIMATIX_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ANIMATIX_CI_CHECKOUT_REF: ${{ inputs.checkout-ref }}
          ANIMATIX_CI_SELECTION: ${{ vars.ANIMATIX_CI_SELECTION || 'enabled' }}
          ANIMATIX_CI_TOPOLOGY: ${{ inputs.topology || 'baseline' }}
        run: scripts/ci.sh gate ci-plan
      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: target/ci/


  gate:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `commit` walks the history since the last tag; the others do not care,
          # and fetching it for all of them is cheaper than a conditional that a
          # later gate has to remember to keep in sync.
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.ref }}

      # Nix source fallback can realize large native dependency closures; the
      # runner image's preinstalled Android/.NET/GHC toolchains are not used by
      # this project and otherwise leave the Nix build with too little disk.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/chromium
          sudo apt-get clean
          df -h /

      # Gates that need nix (cog, cargo-audit, the wasm32 std) get their toolchain
      # from the dev shell, so they must not install a rustup toolchain: PATH
      # order would then decide which rustc runs, and the answer differs per job.
      - name: Install Nix
        if: matrix.shell == 'nix' || matrix.shell == 'web' || matrix.shell == 'web-ci'
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Set up Cachix
        if: matrix.shell == 'nix' || matrix.shell == 'web' || matrix.shell == 'web-ci'
        uses: cachix/cachix-action@v17
        with:
          name: animatix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: 'nix-community'
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Rust (stable)
        if: matrix.shell == 'native' && contains(matrix.setup, 'rust-stable')
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        # Explicit topology trials measure fresh Cargo targets on every host;
        # ordinary PR/main/release checks retain their normal Rust cache.
        if: github.event_name != 'workflow_dispatch' || inputs.checkout-ref == ''
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.shell }}

      # Environment hints from the setup column (rust-*, node, nix, none) are
      # handled by the steps above; the wasm-bindgen CLI now comes from the
      # .#web-build / .#web-ci dev shells, so this is a no-op for them.
      - name: Provision
        shell: bash
        env:
          SETUP: ${{ matrix.setup }}
        run: scripts/ci.sh setup "$SETUP"

      - name: Gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          GATE_SHELL: ${{ matrix.shell }}
          ANIMATIX_GATE_TIMINGS: target/ci/timings.jsonl
        # ci.sh never enters a shell itself — devshells prepend to PATH, so an
        # outer rustc wins and the wasm gate fails looking like a code fault.
        # The matrix's shell column is what says which shell this job owes it.
        run: |
          case "$GATE_SHELL" in
            web) nix develop .#web-build --command scripts/ci.sh gate "$GATE" ;;
            web-ci) nix develop .#web-ci --command scripts/ci.sh gate "$GATE" ;;
            nix) nix develop --command scripts/ci.sh gate "$GATE" ;;
            *)   scripts/ci.sh gate "$GATE" ;;
          esac

      # Upload real files rather than the local build's target/ symlink.
      - name: Stage verified web SDK
        if: contains(matrix.gate, 'web-build')
        run: nix develop --command scripts/ci.sh gate web-artifact-stage

      - name: Upload web runtime
        if: contains(matrix.gate, 'web-build')
        uses: actions/upload-artifact@v4
        with:
          name: web-runtime
          path: target/web-runtime-artifact/
          if-no-files-found: error

      # Retain synthetic transaction frames on failure without weakening checks.
      - name: Upload web transaction failure evidence
        if: failure() && contains(matrix.gate, 'web-transactions')
        uses: actions/upload-artifact@v4
        with:
          name: web-transaction-failure
          path: target/perf/distribution-refactor/web-transactions/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload gate timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.id }}
          path: |
            target/ci/timings.jsonl
            target/ci/environment-*.json
          if-no-files-found: warn

  native_cli:
    name: Experimental CLI Producer
    if: ${{ needs.plan.outputs.topology == 'shared-cli' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/chromium
          sudo apt-get clean
          df -h /
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'workflow_dispatch' || inputs.checkout-ref == ''
        with:
          key: nix
      # Reuse the CLI already built by the registered Test & Examples work;
      # a separate producer would add another complete application build.
      - name: Run registered tests and stage the identified CLI
        env:
          GATES: ${{ needs.plan.outputs.native_cli_gates }}
        run: nix develop --command scripts/ci.sh gate "$GATES" native-cli-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: native-cli
          path: target/ci/native-cli/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-native-cli
          path: |
            target/ci/timings.jsonl
            target/ci/environment-*.json
          if-no-files-found: warn

  shared_render:
    name: Experimental Shared CLI Consumer
    if: ${{ needs.plan.outputs.topology == 'shared-cli' }}
    needs: [plan, native_cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/chromium
          sudo apt-get clean
          df -h /
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: native-cli
          path: target/ci/native-cli
      - name: Verify and consume the registered render gates
        env:
          ANIMATIX_SHARED_CLI: ${{ github.workspace }}/target/ci/native-cli
          GATES: ${{ needs.plan.outputs.shared_render_gates }}
        run: nix develop --command scripts/ci.sh gate verify-native-cli "$GATES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-shared-render
          path: |
            target/ci/timings.jsonl
            target/ci/environment-*.json

  required:
    name: CI Required
    if: ${{ always() }}
    needs: [plan, gate, native_cli, shared_render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - name: Require every selected job
        env:
          ANIMATIX_CI_NEEDS: ${{ toJSON(needs) }}
          ANIMATIX_CI_TOPOLOGY: ${{ needs.plan.outputs.topology }}
        run: scripts/ci.sh gate ci-result
