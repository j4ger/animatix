name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config
      - name: Run tests
        run: cargo test --workspace

  no-video:
    name: Build without video feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Intentionally no FFmpeg system deps — verifies video is truly opt-in.
      # Bare `--no-default-features` is not a supported animatix target; this is
      # the minimal supported no-video feature combination.
      - name: Build animatix crate without video
        run: cargo build -p animatix --no-default-features --features render,text,svg
      - name: Test animatix crate without video
        run: cargo test -p animatix --lib --no-default-features --features render,text,svg

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  extension-bench:
    name: Extension Bench Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run extension benchmark gate
        run: bash scripts/extension-bench.sh --quick --max-plan-ns 10000

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check docs links and roadmap status
        run: bash scripts/check-docs.sh

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit

  examples:
    name: Example Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffmpeg-dev pkg-config
      - name: Build animatix CLI
        run: cargo build --bin animatix
      - name: Validate all examples
        run: bash scripts/check_examples.sh

  eparts-features:
    name: eparts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check eparts default surface
        run: cargo check -p eparts --all-targets
      - name: Check eparts theme-json + gallery
        run: cargo check -p eparts --features theme-json --all-targets
      - name: Test eparts default
        run: cargo test -p eparts --lib
      - name: Test eparts theme-json
        run: cargo test -p eparts --lib --features theme-json

  commit-check:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cocogitto
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cocogitto/cocogitto/main/install.sh | sh
      - name: Check commit messages
        run: cog check
