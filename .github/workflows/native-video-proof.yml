name: Native Video Proof

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/p0-native-proof'
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'examples/assets/narration.*'
      - 'tools/release/native/video-proof.sh'
      - 'tools/release/native/test-first-run.py'
      - 'tools/release/native/windows_sdk_dxc.py'
      - 'tools/release/dist-*.sh'
      - 'tools/release/native-package-check.py'
      - 'tools/ci/ci.sh'

permissions:
  contents: read

jobs:
  nightly-package:
    name: Linux nightly archive validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANIMATIX_RELEASE_LABEL: nightly
      NIX_CONFIG: |
        fallback = true
        extra-substituters = https://cache.nixos.org/
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build and verify the Nightly archives
        run: nix develop .#dist-driver --command tools/ci/ci.sh gate dist-linux
      - name: Retain Linux acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-package-evidence
          path: target/perf/distribution-refactor/native/runtime/
          retention-days: 7
          if-no-files-found: ignore
  native-video:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # Cache compiler output independently of vcpkg's in-progress work tree.
      CARGO_TARGET_DIR: target/release-cargo
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-video-release-dist
          workspaces: . -> target/release-cargo
          cache-on-failure: true
      - name: Build and verify the narrated starter on the target OS
        shell: bash
        run: tools/ci/ci.sh gate native-video-proof
      - name: Retain native export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-video-proof-${{ matrix.os }}-${{ github.sha }}
          path: target/native-video-proof/evidence/
          retention-days: 7
