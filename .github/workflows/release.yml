# Release — one tag, one pipeline, every artifact.
#
# This used to be `workflow_dispatch`, Linux-only, and named "Release Nightly":
# it built two binaries and posted a tag with nothing to say about what version
# they were. There was no path from "a version" to "the things that carry it", so
# the site, the wasm runtimes and the changelog could only be published by hand.
#
# Push an explicit vSemVer tag to publish. Manual dispatch builds an existing
# tag; publishing additionally requires its explicit publish input. Finalized
# notes are read from that exact commit, never regenerated during publication.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to build, e.g. v0.1.0 or v0.2.0-rc.1"
        required: true
        type: string
      publish:
        description: Publish the validated artifacts as a GitHub Release
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NIX_CONFIG: |
    fallback = true
    extra-substituters = https://cache.nixos.org/

jobs:
  # Resolved once, so no job has to re-derive "which version is this" and get a
  # different answer. Checked here rather than trusted, because the value is used
  # to name files that strangers download.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag_object: ${{ steps.resolve.outputs.tag_object }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: resolve
        env:
          DISPATCHED: ${{ inputs.version }}
          TAGGED: ${{ github.ref_name }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: tools/ci/ci.sh gate release-resolve

  # The whole PR gate set, as a release blocker. `uses:` rather than a copy, so
  # there is one list of what green means.
  gates:
    name: Gates
    needs: version
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.version.outputs.commit }}

  plan:
    name: Plan artifacts
    needs: [gates, version]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - id: plan
        run: echo "matrix=$(tools/ci/ci.sh --matrix release)" >> "$GITHUB_OUTPUT"

  dist:
    name: ${{ matrix.name }}
    needs: [plan, version]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      ANIMATIX_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        name: Checkout
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Install Nix
        if: matrix.shell == 'nix' || matrix.shell == 'dist-driver'
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Set up Cachix
        if: matrix.shell == 'nix' || matrix.shell == 'dist-driver'
        uses: cachix/cachix-action@v17
        with:
          name: animatix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: 'nix-community'
      - name: Rust (stable)
        if: matrix.shell == 'native' && contains(matrix.setup, 'rust-stable')
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        if: matrix.shell == 'native'
        uses: Swatinem/rust-cache@v2
      - name: Gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          GATE_SHELL: ${{ matrix.shell }}
          SETUP: ${{ matrix.setup }}
        run: |
          tools/ci/ci.sh setup "$SETUP"
          case "$GATE_SHELL" in
            dist-driver) nix develop .#dist-driver --command tools/ci/ci.sh gate "$GATE" ;;
            nix) nix develop --command tools/ci/ci.sh gate "$GATE" ;;
            *)   tools/ci/ci.sh gate "$GATE" ;;
          esac
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.gate }}
          path: dist/
          if-no-files-found: error

  # Reuse the exact SDK built and exercised by the reusable CI workflow.
  site:
    name: Site and web SDK
    needs: [gates, version]
    runs-on: ubuntu-latest
    env:
      ANIMATIX_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Download tested SDK
        uses: actions/download-artifact@v4
        with:
          name: web-runtime
          path: web/runtime
      - name: Verify and assemble site
        run: nix develop --command tools/ci/ci.sh gate web-artifact-verify site-artifact
      - name: Exercise assembled release site
        run: nix develop .#web-ci --command tools/ci/ci.sh gate site-smoke
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-site-smoke-evidence
          path: target/web-smoke/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package verified site and SDK
        run: nix develop --command tools/ci/ci.sh gate dist-site dist-web-sdk
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-site
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    if: needs.version.outputs.publish == 'true'
    needs: [version, dist, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v7
        with:
          pattern: artifact-*
          path: out
          merge-multiple: true
      - name: Verify tag identity and use finalized notes
        env:
          ANIMATIX_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          ANIMATIX_RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
          ANIMATIX_RELEASE_TAG_OBJECT: ${{ needs.version.outputs.tag_object }}
        run: tools/ci/ci.sh gate release-verify release-notes
      - name: Create release once without updating an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          ANIMATIX_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          ANIMATIX_RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
          ANIMATIX_RELEASE_TAG_OBJECT: ${{ needs.version.outputs.tag_object }}
        run: tools/ci/ci.sh gate release-publish
