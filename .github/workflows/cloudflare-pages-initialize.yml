name: Initialize Pages release journal

# No deployment or release ref mutation. Safe repeats only accept the exact
# completed journal for the current canonical deployment; all drift freezes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    if: github.repository == 'j4ger/animatix' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages-sole-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Validate Pages access and initialize journal without deploying
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
        run: scripts/ci.sh gate cloudflare-pages-initialize
