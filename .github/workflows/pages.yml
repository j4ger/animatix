# Deploy the web site (homepage, language tour, demos) to GitHub Pages.
#
# The deploy artifact is the runtime web tree plus web/pkg-slim,
# web/pkg-assets and the generated web/fonts gzip pack (web/pkg is a release
# asset, not a site payload). They are gitignored, so CI rebuilds them on every
# run. GitHub Pages does not negotiate brotli precompression, so the .br twins
# are dropped from the artifact (the raw .wasm files are what gets served; the
# font pack is explicitly gzip and is decompressed by the player).
#
# This workflow used to own three checks that PR CI did not run — the embed
# bundle build, the site scene build in both profiles, and the wasm compile —
# which meant a broken `web/embed/amx-player.js` could be discovered *after*
# the merge it was supposed to protect. They are gates in scripts/ci.sh now, so
# a PR runs exactly them; this file keeps the deploy build/assembly as the
# release blocker, while the browser smoke stays in CI so a software-GPU retry
# is not paid (or flaked) twice for the same commit.
#
# NOTE for maintainers: Pages must be enabled once in the repo settings
# (Settings → Pages → Source: "GitHub Actions"); after that this workflow
# owns deployments.
name: Deploy site to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    fallback = true
    extra-substituters = https://cache.nixos.org/

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: animatix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: 'nix-community'

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/tools/package-lock.json

      # The two gates that used to live here as hand-written steps, plus the
      # embed-bundle build smoke. Ordered cheap-first: embed-build is two npm
      # builds, site_scenes is a native test, and the engine builds are the
      # minutes-long step — no reason to pay for two wasm links before the fast
      # gates agree.
      - name: Gates (embed bundle build, site scenes in shipped profiles)
        run: scripts/ci.sh gate embed-build site-scenes

      - name: Build engines
        # `.#web-ci` is the only shell with a wasm32 std and the pinned
        # wasm-bindgen CLI. Building here is required: pkg/ is gitignored and
        # this workflow gets a fresh checkout, not the CI runner's workspace.
        # The browser smoke already ran in CI for this exact commit; repeating
        # it here doubled the deploy time and gave a software-GPU flake a second
        # chance to block deployment. `workflow_run` success is the smoke gate.
        run: nix develop .#web-ci --command scripts/ci.sh gate web-build

      # The same assembler the release pipeline zips with (scripts/site-artifact.sh):
      # the .br twins dropped, .nojekyll written, both engine bundles required.
      - name: Assemble site
        run: scripts/ci.sh gate site-artifact

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
