# Deploy the web site (homepage, language tour, demos) to GitHub Pages.
#
# The deploy artifact is web/ plus the two engine builds (web/pkg-slim,
# web/pkg) that scripts/build-web.sh produces — they are gitignored, so CI
# rebuilds them on every run. GitHub Pages does not negotiate brotli
# precompression, so the .br twins are dropped from the artifact (the raw
# .wasm files are what gets served).
#
# NOTE for maintainers: Pages must be enabled once in the repo settings
# (Settings → Pages → Source: "GitHub Actions"); after that this workflow
# owns deployments.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # The deployed bundles embed the whole engine and the scenes import
      # `examples/lib/*`, so any change there can change what the site renders.
      # A filter that only watched `web/**` left the deployed site running an
      # engine that no longer matches the source it plays.
      - "web/**"
      - "crates/**"
      - "examples/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.nix"
      - "scripts/build-web.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # wasm-bindgen-cli must match the version pinned in
      # crates/animatix-web/Cargo.toml exactly — a mismatch fails glue
      # generation — so the version is read from that file, not duplicated here.
      - name: Install wasm-bindgen-cli (version from crates/animatix-web/Cargo.toml)
        run: |
          WBG="$(grep -oP 'wasm-bindgen = "=\\K[0-9.]+' crates/animatix-web/Cargo.toml)"
          echo "wasm-bindgen-cli version: $WBG"
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG}/wasm-bindgen-${WBG}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz
          install -m 0755 "wasm-bindgen-${WBG}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Install wasm-opt and brotli
        run: sudo apt-get update && sudo apt-get install -y binaryen brotli

      - name: Check the embed distributable matches its source
        # `web/embed/amx-player.js` is the committed esbuild output of
        # `web/embed/src/amx-player.js` (`npm run build:embed`), and Pages
        # ships the committed copy — so a src change that skipped the rebuild
        # would deploy the previous player while the repo looked fixed.
        run: |
          npm --prefix web/tools ci
          npm --prefix web/tools run build:embed
          git diff --exit-code web/embed/amx-player.js

      - name: Check every scene the site plays (both profiles)
        # The deploy gate the browser-only failures need: a scene only the full
        # engine can build, or an import/asset url that resolves to nothing
        # next to its page, shows up as a "Scene error" veil on the deployed
        # site and is invisible to the engine's own suite. `--slim` is exactly
        # `--no-default-features` (see scripts/build-web.sh), so these two runs
        # cover both shipped bundles.
        run: |
          cargo test -p animatix-web --test site_scenes
          cargo test -p animatix-web --test site_scenes --no-default-features

      - name: Build engines (slim + full)
        run: |
          scripts/build-web.sh --slim
          scripts/build-web.sh

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          find _site -name '*.br' -delete
          touch _site/.nojekyll
          du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
