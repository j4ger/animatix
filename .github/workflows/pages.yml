# Deploy the same verified SDK artifact CI tested; every check is a ci.sh gate.
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    fallback = true
    extra-substituters = https://cache.nixos.org/

jobs:
  build:
    if: ${{ vars.ANIMATIX_GH_PAGES_FALLBACK == 'enabled' }}
    runs-on: ubuntu-latest
    env:
      ANIMATIX_ARTIFACT_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      ANIMATIX_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve Pages base path
        id: pages
        uses: actions/configure-pages@v5
      - name: Download CI SDK
        id: sdk
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-runtime
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/downloaded-web-runtime
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: animatix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: 'nix-community'
      - name: Confirm failed download means SDK artifact is absent or expired
        id: sdk_absence
        if: github.event_name == 'workflow_run' && steps.sdk.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop --command tools/ci/ci.sh gate web-artifact-absence
      # A successful download that is corrupt, incomplete or from another SHA
      # fails here. Only an absent artifact/manual dispatch may rebuild.
      - name: Verify downloaded SDK
        if: steps.sdk.outcome == 'success'
        run: nix develop --command tools/ci/ci.sh gate web-artifact-restore
      - name: Build and test SDK when CI artifact is absent
        if: github.event_name != 'workflow_run' || (steps.sdk.outcome != 'success' && steps.sdk_absence.outcome == 'success')
        run: nix develop .#web-ci --command tools/ci/ci.sh gate web-split-proof web-build web-sdk-integrity text-parity web-raster-proof web-smoke web-transactions
      - name: Site scenes
        if: github.event_name != 'workflow_run' || (steps.sdk.outcome != 'success' && steps.sdk_absence.outcome == 'success')
        run: nix develop --command tools/ci/ci.sh gate site-scenes
      - name: Assemble verified site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: nix develop --command tools/ci/ci.sh gate web-artifact-verify site-artifact
      - name: Exercise assembled site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: nix develop .#web-ci --command tools/ci/ci.sh gate site-smoke
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-smoke-evidence
          path: target/web-smoke/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
