# Deploy the same verified SDK artifact CI tested; every check is a ci.sh gate.
name: Deploy site to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    fallback = true
    extra-substituters = https://cache.nixos.org/

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      ANIMATIX_ARTIFACT_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Download CI SDK
        id: sdk
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-runtime
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/downloaded-web-runtime
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: animatix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: 'nix-community'
      # A successful download that is corrupt, incomplete or from another SHA
      # fails here. Only an absent artifact/manual dispatch may rebuild.
      - name: Verify downloaded SDK
        if: steps.sdk.outcome == 'success'
        run: nix develop --command scripts/ci.sh gate web-artifact-restore
      - name: Build and test SDK when CI artifact is absent
        if: github.event_name != 'workflow_run' || steps.sdk.outcome != 'success'
        run: nix develop .#web-ci --command scripts/ci.sh gate web-split-proof web-build web-sdk-integrity text-parity web-raster-proof web-smoke web-transactions
      - name: Site scenes
        if: github.event_name != 'workflow_run' || steps.sdk.outcome != 'success'
        run: nix develop --command scripts/ci.sh gate site-scenes
      - name: Assemble verified site
        run: nix develop --command scripts/ci.sh gate web-artifact-verify site-artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
