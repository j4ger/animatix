# Deploy the web site (homepage, language tour, demos) to GitHub Pages.
#
# The deploy artifact is web/ plus the two engine builds (web/pkg-slim,
# web/pkg) that scripts/build-web.sh produces — they are gitignored, so CI
# rebuilds them on every run. GitHub Pages does not negotiate brotli
# precompression, so the .br twins are dropped from the artifact (the raw
# .wasm files are what gets served).
#
# This workflow used to own three checks that PR CI did not run — the embed
# bundle drift, the site scene build in both profiles, and the wasm compile —
# which meant the gate that catches a stale `web/embed/amx-player.js` fired
# *after* the merge it was supposed to protect. They are gates in scripts/ci.sh
# now, so a PR runs exactly them; this file keeps the deploy and re-runs the
# gates as the release blocker it always was.
#
# NOTE for maintainers: Pages must be enabled once in the repo settings
# (Settings → Pages → Source: "GitHub Actions"); after that this workflow
# owns deployments.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # The deployed bundles embed the whole engine and the scenes import
      # `examples/lib/*`, so any change there can change what the site renders.
      # A filter that only watched `web/**` left the deployed site running an
      # engine that no longer matches the source it plays.
      - "web/**"
      - "crates/**"
      - "examples/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.nix"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The two gates that used to live here as hand-written steps, plus the
      # bundle-drift check. Ordered cheap-first: embed-drift is an npm build,
      # site_scenes is a native test, and the engine builds are the minutes-long
      # step — no reason to pay for two wasm links before the fast gates agree.
      - name: Gates (embed bundle drift, site scenes in both profiles)
        run: scripts/ci.sh gate embed-drift site-scenes

      - name: Build engines (slim + full)
        # `.#web-build` is the only shell with a wasm32 std, and the wasm-bindgen
        # CLI must equal the pin in crates/animatix-web/Cargo.toml exactly. ci.sh
        # never enters the shell itself — devshells prepend, so an outer rustc
        # would win and the build would fail looking like a code fault.
        run: |
          scripts/ci.sh setup wasm-bindgen
          nix develop .#web-build --command scripts/ci.sh gate web-build

      # The same assembler the release pipeline zips with (scripts/site-artifact.sh):
      # the .br twins dropped, .nojekyll written, both engine bundles required.
      - name: Assemble site
        run: scripts/ci.sh gate site-artifact

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
