# Nightly — daily automated rolling build of main with video support.
#
# Runs on a schedule (daily at 02:00 UTC) and on manual dispatch.
# A fast check job skips execution when there are no new commits on main since
# the last successful nightly run, saving runner time.
#
# Storage-efficient rolling release: maintains a single pre-release tagged
# `nightly` (replaces previous assets) rather than accumulating dozens of historical
# builds in storage.
name: Nightly

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if no changes on main'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    permissions:
      actions: read
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Build forced via workflow_dispatch."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha=$(gh run list --workflow nightly.yml --status success --branch main --limit 1 --json headSha --jq '.[0].headSha')
          if [ -n "$last_sha" ] && [ "${{ github.sha }}" = "$last_sha" ]; then
            echo "No changes on main since last successful nightly ($last_sha)."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected (current: ${{ github.sha }}, last: ${last_sha:-none})."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Release details
        id: details
        run: echo "title=Nightly Build ($(date -u +'%Y-%m-%d %H:%M UTC'))" >> "$GITHUB_OUTPUT"

      # The same gate a release runs, so a nightly and a release are the same
      # build command rather than two. ANIMATIX_RELEASE_LABEL names the files
      # `nightly-…` instead of `v0.1.0-…`.
      - name: Build and package (video, Linux)
        env:
          ANIMATIX_RELEASE_LABEL: nightly
        run: nix develop --command scripts/ci.sh gate dist-linux

      # Delete previous rolling 'nightly' release and any legacy 'nightly-*' releases
      # to reclaim storage quota before publishing the new pre-release.
      - name: Prune previous nightly releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --cleanup-tag -y 2>/dev/null || true
          gh release list --exclude-drafts --limit 30 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly-"))) | .tagName' \
            | while read -r old_tag; do
                [ -n "$old_tag" ] || continue
                echo "Pruning legacy nightly release: $old_tag"
                gh release delete "$old_tag" --cleanup-tag -y || true
              done

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: ${{ steps.details.outputs.title }}
          prerelease: true
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
