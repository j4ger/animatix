<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>amx-player multi-instance probe</title>
  <style>
    body { background: #0d1016; color: #dbe2ec; font: 14px system-ui; margin: 0; padding: 40px; }
    h1 { font-size: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0; }
    amx-player { border: 1px solid #232b38; }
    pre { color: #8b96a7; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Multi-instance probe</h1>
  <pre id="report">waiting…</pre>
  <amx-player src="../pkg/examples/hello.amx" autoplay loop title="Hello"></amx-player>
  <div class="row">
    <amx-player src="../pkg/examples/plots.amx" autoplay loop title="Plots"></amx-player>
    <amx-player src="../pkg/examples/motion.amx" autoplay loop title="Motion"></amx-player>
  </div>
  <div style="height: 60vh"></div>
  <amx-player src="../pkg/examples/epicycles.amx" autoplay loop title="Epicycles (below fold)"></amx-player>

  <script type="module">
    await import("../embed/amx-player.js");

    // report engine device count + per-instance health for the CDP driver
    const report = { engines: 0, errors: [], players: 0, t0: performance.now() };
    const origCreate = Object.getOwnPropertyDescriptor;
    // count wasm engine loads by watching performance entries for the wasm
    const seen = new Set();
    const obs = new PerformanceObserver((list) => {
      for (const e of list.getEntries()) {
        if (e.name?.includes("animatix_web_bg.wasm")) seen.add(e.name.split("?")[0]);
      }
      report.wasmFetches = seen.size;
    });
    obs.observe({ type: "resource", buffered: true });

    window.addEventListener("error", (e) => report.errors.push(String(e.message)));
    const origError = console.error;
    console.error = (...a) => { report.errors.push(a.map(String).join(" ").slice(0, 120)); origError(...a); };

    const tick = () => {
      const els = [...document.querySelectorAll("amx-player")];
      report.players = els.length;
      report.playing = els.filter((el) => el._playing).length;
      report.wasmFetches ??= 0;
      document.getElementById("report").textContent = JSON.stringify(report);
      requestAnimationFrame(tick);
    };
    tick();
    window.__probe_state = { phase: "running", get report() { return report; } };
    // phase flip for the driver after enough time to render
    setTimeout(() => { window.__probe_state.phase = "done"; }, 12000);
  </script>
</body>
</html>
