<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>animatix-web frame-cost probe</title>
    <!-- Self-contained QA harness: dark inline styling like multi-probe /
         svg-probe, deliberately not the site skin. -->
    <script>
      // Capture a Wasm panic before module initialization can log and abort.
      window.__console_errors = [];
      const origError = console.error.bind(console);
      console.error = (...args) => {
        window.__console_errors.push(args.map(String).join(" "));
        origError(...args);
      };
    </script>
    <style>
      body {
        max-width: 1100px; margin: 0 auto; padding: 24px;
        background: #0a0f17; color: #e2e7ee;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 18px; margin: 0 0 10px; }
      #players { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 12px; }
      #players amx-player { width: 100%; }
      table { border-collapse: collapse; margin-top: 18px; width: 100%; }
      th, td { text-align: right; padding: 4px 10px; border-bottom: 1px solid #333; font-variant-numeric: tabular-nums; }
      th { color: #9aa5b4; font-weight: 500; }
      th:first-child, td:first-child { text-align: left; }
      .bad { color: #e2704a; }
      .good { color: #6fbf73; }
      pre { white-space: pre-wrap; font-size: 12px; opacity: .85; color: #c8d3e0; }
      #meta { font-size: 13px; opacity: .8; color: #9aa5b4; }
    </style>
  </head>
  <body>
    <h1>animatix-web frame-cost probe</h1>
    <p id="meta">measuring…</p>
    <div id="players"></div>
    <table id="results"><tbody></tbody></table>
    <pre id="ledger"></pre>

    <script type="module">
      // Web-playback performance harness. Companion to
      // tools/quality/perf-bench.sh (native CPU) and examples/export_perf_driver.rs
      // (native GPU/export); the design note is the "Web playback" section of
      // docs/performance_evaluation.md.
      //
      // Why it drives frames by hand instead of timing the page's own rAF loop:
      // a headless or backgrounded tab delivers *no* rAF callbacks, and
      // `queue.submit` returns as soon as the frame is encoded — several
      // milliseconds before the GPU has drawn it. Timing `render_frame` alone
      // therefore reports ~0.5 ms for a frame that actually costs ~4 ms.
      // Throughput drains a batch of ticks. Queue-depth-one latency drains each
      // tick separately, and CPU submission time is recorded independently.
      //
      //   ?scene=<url>     scene to load        (default ../demos/transformer/scenes/attention.amx)
      //   ?backend=<mode>  webgpu, webgl2, or auto (default webgpu)
      //   ?base=<dir>      SDK directory for an A/B (default ../runtime)
      //   ?players=<n>     embeds on the page   (default 1)
      //   ?frames=<n>      frames per sample    (default 60)
      //   ?scales=1,.7,.5  render scales to sweep (default 1,0.85,0.72,0.6,0.5)
      const params = new URLSearchParams(location.search);
      // A harness that fails silently is worse than no harness: a top-level
      // await that rejects in a module script only reaches the console, which
      // an automated driver cannot read.
      const showError = (error) => {
        window.__perf_error = String(error);
        document.getElementById("meta").textContent = window.__perf_error;
      };
      window.addEventListener("error", (e) => showError(e.message ?? e.error));
      window.addEventListener("unhandledrejection", (e) => showError(e.reason?.stack ?? e.reason));
      const scene = params.get("scene") ?? "../demos/transformer/scenes/attention.amx";
      const base = new URL(`${params.get("base") ?? "../runtime"}/`, document.baseURI);
      const requestedBackend = params.get("backend") ?? "webgpu";
      const count = Math.max(1, Math.min(8, Math.trunc(Number(params.get("players") ?? 1)) || 1));
      const frames = Math.max(10, Math.min(400, Math.trunc(Number(params.get("frames") ?? 60)) || 60));
      // Repeat each sample and keep the fastest run. A browser frame measured
      // from a script is hostage to whatever else the machine is doing — the
      // minimum is the closest thing to "what this code costs" and is stable
      // where the mean is not.
      const reps = Math.max(1, Math.min(9, Number(params.get("reps") ?? 1) || 1));
      const scales = (params.get("scales") ?? "1,0.85,0.72,0.6,0.5")
        .split(",")
        .map(Number)
        .filter((s) => s > 0 && s <= 1);

      // Let each SDK initialize via its own integrity-checked player loader.
      const started = performance.now();
      const manifestUrl = new URL("runtime-manifest.json", base);
      const sdk = await import(new URL("amx-player.js", base));
      sdk.configureRuntime({ manifestUrl: manifestUrl.href, backend: requestedBackend });

      const host = document.getElementById("players");
      host.style.setProperty("--cols", String(Math.min(3, count)));
      const elements = [];
      const loads = [];
      for (let i = 0; i < count; i += 1) {
        const el = document.createElement("amx-player");
        el.setAttribute("src", scene);
        el.setAttribute("aspect", "16:9");
        el.setAttribute("quality", "production");
        el.setAttribute("eager", "");
        loads.push(new Promise((resolve, reject) => {
          el.addEventListener("amxready", () => resolve(performance.now()), { once: true });
          el.addEventListener("amxerror", (event) => {
            reject(new Error(event.detail?.message ?? "scene failed to load"));
          }, { once: true });
        }));
        host.appendChild(el);
        elements.push(el);
      }

      let timeout;
      const ready = await Promise.race([
        Promise.all(loads),
        new Promise((_, reject) => {
          timeout = setTimeout(() => reject(new Error("timed out loading the scene")), 60000);
        }),
      ]).finally(() => clearTimeout(timeout));
      const firstReadyMs = Math.min(...ready) - started;
      const loadMs = Math.max(...ready) - started;
      for (const el of elements) el.pause();
      const players = elements.map((el) => el._player);
      const backend = elements[0].backend ?? "webgpu";
      if (elements.some((el) => (el.backend ?? "webgpu") !== backend)) {
        throw new Error("players selected different backends");
      }
      if (requestedBackend !== "auto" && backend !== requestedBackend) {
        throw new Error(`SDK selected ${backend} for ${requestedBackend}`);
      }
      const { manifest, module: engine } = elements[0]._runtime;
      window.__engine = engine;
      const contexts = backend === "webgl2"
        ? elements.map((el) => el._canvas.getContext("webgl2"))
        : [];
      const drain = backend === "webgl2"
        ? () => drainWebGL(contexts)
        : () => engine.debug_gpu_drain();
      await drain();
      const startupCompletedMs = performance.now() - started;
      const scenePx = [players[0].scene_width(), players[0].scene_height()];
      const canvasCss = [elements[0]._canvas.clientWidth, elements[0]._canvas.clientHeight];

      // A GL device lives on each canvas. Fence all of them after submission
      // and yield between zero-timeout checks so the browser can make progress.
      async function drainWebGL(contexts) {
        const pending = [];
        try {
          for (const gl of contexts) {
            const fence = gl?.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            if (!fence) throw new Error("WebGL2 queue fence unavailable");
            pending.push({ gl, fence });
            gl.flush();
          }
          const deadline = performance.now() + 30000;
          while (pending.length) {
            for (let i = pending.length - 1; i >= 0; i--) {
              const { gl, fence } = pending[i];
              const status = gl.clientWaitSync(fence, 0, 0);
              if (status === gl.TIMEOUT_EXPIRED) continue;
              if (status === gl.WAIT_FAILED) throw new Error("WebGL2 queue fence failed");
              gl.deleteSync(fence);
              pending.splice(i, 1);
            }
            if (!pending.length) break;
            if (performance.now() >= deadline) throw new Error("WebGL2 queue fence timed out");
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        } finally {
          for (const { gl, fence } of pending) gl.deleteSync(fence);
        }
      }

      const stats = (xs) => {
        const s = [...xs].sort((a, b) => a - b);
        const at = (p) => s[Math.min(s.length - 1, Math.floor(s.length * p))];
        return {
          mean: xs.reduce((a, b) => a + b, 0) / xs.length,
          p50: at(0.5),
          p90: at(0.9),
          p95: at(0.95),
          max: s[s.length - 1],
        };
      };
      const round = (v, d = 2) => Number(v.toFixed(d));

      // One sample: `frames` ticks, every player rendering one frame per tick,
      // then one GPU drain. Reported per tick — that is the page's frame cost.
      async function sample(scale) {
        window.__perf_progress = `scale ${scale}: set`;
        for (const p of players) p.set_render_scale(scale);
        window.__perf_progress = `scale ${scale}: warmup`;
        for (const p of players) p.debug_bench_warmup(3);
        window.__perf_progress = `scale ${scale}: drain`;
        await drain();
        window.__perf_progress = `scale ${scale}: cpu`;
        let cpu = players.map((p) => JSON.parse(p.debug_bench_frames(8, 1 / 60)));
        for (let rep = 1; rep < reps; rep += 1) {
          const again = players.map((p) => JSON.parse(p.debug_bench_frames(8, 1 / 60)));
          cpu = cpu.map((c, i) => (again[i].cpu_ms < c.cpu_ms ? again[i] : c));
        }
        window.__perf_progress = `scale ${scale}: ticks`;
        await drain();
        let ticks = [];
        let wallPerTick = Infinity;
        for (let rep = 0; rep < reps; rep += 1) {
          const t0 = performance.now();
          const thisRep = [];
          for (let i = 0; i < frames; i += 1) {
            const a = performance.now();
            for (const p of players) p.render_frame(i / 60);
            thisRep.push(performance.now() - a);
          }
          await drain();
          const perTick = (performance.now() - t0) / frames;
          if (perTick < wallPerTick) {
            wallPerTick = perTick;
            ticks = thisRep;
          }
        }
        const raster = players.map((p) => [p.raster_width(), p.raster_height()]);
        window.__perf_progress = `scale ${scale}: queue depth one`;
        const completedTicks = [];
        const drawnBefore = players.map((p) => p.debug_dedup_stats().drawn);
        for (let i = 0; i < frames; i++) {
          const t0 = performance.now();
          for (const p of players) p.render_frame(i / 60);
          await drain();
          completedTicks.push(performance.now() - t0);
        }
        if (players.some((p, i) => p.debug_dedup_stats().drawn - drawnBefore[i] !== frames)) {
          throw new Error("a player skipped frames during the queue-depth-one sample");
        }
        // The rest case a looping embed lives in: one frame, asked for again and
        // again. The raster dedup turns that into a signature compare, so this
        // should fall to a small fraction of `page_ms` — and if it ever equals
        // `page_ms`, the skip has silently stopped working.
        window.__perf_progress = `scale ${scale}: rest`;
        let restPerTick = Infinity;
        for (let rep = 0; rep < reps; rep += 1) {
          const t0 = performance.now();
          for (let i = 0; i < frames; i += 1) {
            for (const p of players) p.render_frame(0.5);
          }
          await drain();
          restPerTick = Math.min(restPerTick, (performance.now() - t0) / frames);
        }
        return {
          scale,
          raster,
          page_ms: round(wallPerTick),
          per_embed_ms: round(wallPerTick / count),
          rest_ms: round(restPerTick),
          deduped: players.reduce((a, p) => a + (p.debug_dedup_stats?.().deduped ?? 0), 0),
          cpu_ms: round(cpu.reduce((a, c) => a + c.cpu_ms, 0) / count),
          cpu_p90_ms: round(Math.max(...cpu.map((c) => c.cpu_p90_ms))),
          jitter: stats(ticks),
          queue_depth_one_p95_ms: round(stats(completedTicks).p95),
        };
      }

      const rows = [];
      // The embed owns its render scale and re-asserts it asynchronously (its
      // ResizeObserver fires after the canvas backing changes), which would
      // override an explicit sweep — the first sample of a run measured the
      // display-matched scale while reporting 1.0. Suspend that ownership for
      // the duration; `_applyRenderScale` hands it back below.
      for (const el of elements) {
        el._renderScaleObserver?.disconnect();
        clearTimeout(el._renderScaleRetry);
      }
      for (const scale of scales) rows.push(await sample(scale));
      for (const el of elements) {
        el._renderScaleObserver?.observe(el._stage);
        el._applyRenderScale();
      }

      // Restore what the page itself asked for, and let the embeds pick their
      // display-matched scale back up.
      for (const el of elements) el._applyRenderScale();
      for (const p of players) p.debug_bench_warmup(1);
      await drain();

      const meta = {
        scene,
        engine_base: base.href,
        requested_backend: requestedBackend,
        backend,
        queue_completion: backend === "webgl2" ? "clientWaitSync with browser timer polling" : "onSubmittedWorkDone",
        scene_px: scenePx,
        canvas_css_px: canvasCss,
        canvas_backing_px: [elements[0]._canvas.width, elements[0]._canvas.height],
        device_pixel_ratio: window.devicePixelRatio,
        players: count,
        frames_per_sample: frames,
        reps,
        quality: "production",
        first_ready_ms: round(firstReadyMs, 1),
        load_ms: round(loadMs, 1),
        startup_queue_completed_ms: round(startupCompletedMs, 1),
        build_id: manifest.build_id,
        source_commit: manifest.build.source_commit,
      };
      const report = { ...meta, samples: rows };
      window.__perf = report;

      document.getElementById("meta").textContent =
        `${scene} — ${scenePx[0]}x${scenePx[1]} scene, displayed at ${canvasCss[0]}x${canvasCss[1]} CSS px ` +
        `(dpr ${meta.device_pixel_ratio}), ${count} player${count > 1 ? "s" : ""}, ${backend}, build ${meta.build_id}`;
      const tbody = document.querySelector("#results tbody");
      const head = document.createElement("tr");
      head.innerHTML = "<th>scale</th><th>raster px</th><th>page ms / tick</th><th>per embed ms</th><th>cpu ms</th><th>cpu p90</th><th>completed tick p95</th><th>cpu tick max</th><th>16.7 ms</th>";
      tbody.appendChild(head);
      for (const r of rows) {
        const budget = r.page_ms <= 16.7;
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td>${r.scale}</td>` +
          `<td>${r.raster[0].join("x")}</td>` +
          `<td class="${budget ? "good" : "bad"}">${r.page_ms}</td>` +
          `<td>${r.per_embed_ms}</td>` +
          `<td>${r.cpu_ms}</td>` +
          `<td>${r.cpu_p90_ms}</td>` +
          `<td>${r.queue_depth_one_p95_ms}</td>` +
          `<td>${round(r.jitter.max)}</td>` +
          `<td>${budget ? "ok" : "over"}</td>`;
        tbody.appendChild(tr);
      }
      document.getElementById("ledger").textContent = JSON.stringify(report, null, 2);
      document.title = `perf: ${rows.map((r) => `${r.scale}=${r.page_ms}ms`).join(" ")}`;
    </script>
  </body>
</html>
