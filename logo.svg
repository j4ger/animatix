<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <linearGradient id="gradSolid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="gradDash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <linearGradient id="maskFadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="1" />
      <stop offset="70%" stop-color="white" stop-opacity="0.5" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="maskLeft">
      <rect width="100%" height="100%" fill="url(#maskFadeLeft)" />
    </mask>

    <linearGradient id="maskFadeRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="1" />
      <stop offset="70%" stop-color="white" stop-opacity="0.5" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="maskRight">
      <rect width="100%" height="100%" fill="url(#maskFadeRight)" />
    </mask>
  </defs>

  <rect width="140" height="140" rx="28" fill="#0B1120" />

  <g fill="#1E293B">
    <circle cx="35" cy="35" r="1.8" />
    <circle cx="70" cy="35" r="1.8" />
    <circle cx="105" cy="35" r="1.8" />
    <circle cx="35" cy="70" r="1.8" />
    <circle cx="105" cy="70" r="1.8" />
    <circle cx="35" cy="105" r="1.8" />
    <circle cx="70" cy="105" r="1.8" />
    <circle cx="105" cy="105" r="1.8" />
  </g>

  <circle cx="56" cy="70" r="28" fill="none" stroke="url(#gradSolid)" stroke-width="4" stroke-linecap="round" mask="url(#maskLeft)" />

  <circle cx="84" cy="70" r="28" fill="none" stroke="url(#gradDash)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" mask="url(#maskRight)" />
</svg>
