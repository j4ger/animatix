[workspace]
members = [
    "crates/animatix",
    "crates/animatix-core",
    "crates/animatix-render",
    "crates/animatix-std",
    "crates/animatix-analyzer",
    "crates/animatix-cli",
    "crates/animatix-gui",
    "crates/animatix-lsp",
    "crates/animatix-plugin-api",
    "crates/animatix-plugin-demo",
    "crates/animatix-plugin-tooling",
    "crates/animatix-syntax",
    "crates/animatix-text",
    "crates/animatix-web",
    "crates/eparts"
]
resolver = "2"

# One version for the whole workspace. `cargo set-version --workspace` — the
# pre_bump_hooks command that `cog bump` runs — writes here and nowhere else, so a
# release cannot half-bump. Before this, 15 manifests each hand-declared
# `version = "0.1.0"` and nothing checked that they agreed; `scripts/ci.sh gate
# meta-version` now does, off `cargo metadata` rather than off the text of the
# files, so it catches a member that resolves to something else for any reason.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# egui stack — single source of truth, shared by eparts + animatix-gui
egui            = { version = "0.34" }
eframe          = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui-phosphor   = { version = "0.12", default-features = false, features = ["regular"] }
egui_extras     = { version = "0.34", features = ["syntect"] }
egui_tiles      = { version = "0.15", features = ["serde"] }
egui_code_editor = { version = "0.2", features = ["editor", "egui"] }

# Shared graphics dep already duplicated across animatix + animatix-gui
wgpu            = { version = "29.0.0", default-features = false }

# Shared runtime/serialization deps used by multiple workspace crates
bytemuck        = "1.25.0"
pollster        = "0.4.0"
image           = { version = "0.25.10", default-features = false }
kurbo           = "0.13.0"
serde           = { version = "1", features = ["derive"] }
thiserror       = "2.0"
tracing         = "0.1"

# Profiling support (docs/performance_evaluation.md §7): bench builds keep
# debug symbols so `perf record`/flamegraph can resolve frames without changing
# the optimization level. `cargo build --profile profiling` gives the GUI/CLI a
# release-equivalent build with symbols for the same purpose.
[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = true

# The browser player's build (scripts/build-web.sh). Kept separate from
# `release` so tuning it cannot move a native benchmark baseline: `perf-bench.sh`
# and the Layer-3 drivers all build through `release`, and the web player is the
# one target whose frame cost is dominated by GPU work and whose CPU share is
# paid inside a wasm sandbox.
#
# `lto = "fat"` + one codegen unit is what buys cross-crate inlining for the
# engine's evaluate/encode path. Measured effect is on artifact size, not frame
# time: the browser frame is GPU-bound and an A/B of the two builds could not
# separate them (docs/performance_evaluation.md §3.7).
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
# Already the default for this target — `rustc --print cfg --target
# wasm32-unknown-unknown` reports panic="abort" — so this is a declaration, not
# a change. It is here so the profile does not silently acquire unwinding
# tables if that default is ever revised.
panic = "abort"
