[workspace]
members = [
    "crates/animatix",
    "crates/animatix-core",
    "crates/animatix-render",
    "crates/animatix-std",
    "crates/animatix-analyzer",
    "crates/animatix-cli",
    "crates/animatix-gui",
    "crates/animatix-lsp",
    "crates/animatix-plugin-api",
    "crates/animatix-plugin-demo",
    "crates/animatix-plugin-tooling",
    "crates/animatix-syntax",
    "crates/animatix-text",
    "crates/animatix-web",
    "crates/animatix-hybrid-bench",
    "crates/eparts"
]
resolver = "2"

# One version for the whole workspace. `cargo set-version --workspace` — the
# pre_bump_hooks command that `cog bump` runs — writes here and nowhere else, so a
# release cannot half-bump. Before this, 15 manifests each hand-declared
# `version = "0.1.0"` and nothing checked that they agreed; `scripts/ci.sh gate
# meta-version` now does, off `cargo metadata` rather than off the text of the
# files, so it catches a member that resolves to something else for any reason.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# egui stack — single source of truth, shared by eparts + animatix-gui.
# egui-phosphor is aliased to egui-pop-phosphor: the maintained fork of
# egui-phosphor that supports egui 0.37 (upstream 0.14 still pins egui 0.36).
# The alias keeps the `egui_phosphor::regular::*` / `add_to_fonts` API and the
# same Phosphor codepoints, so no widget code changes. Switch back to upstream
# `egui-phosphor` as soon as it ships an egui-0.37 release.
egui            = { version = "0.37.0" }
eframe          = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui-phosphor   = { package = "egui-pop-phosphor", version = "0.15.0", default-features = false, features = ["regular"] }
egui_tiles      = { version = "0.18.0", features = ["serde"] }

# Shared graphics dep already duplicated across animatix + animatix-gui
wgpu            = { version = "30.0.1", default-features = false }
vello           = { version = "0.11.0", default-features = false, features = ["wgpu"] }

# Shared runtime/serialization deps used by multiple workspace crates
bytemuck        = "1.25.0"
pollster        = "0.4.0"
image           = { version = "0.25.10", default-features = false }
kurbo           = "0.13.0"
serde           = { version = "1", features = ["derive"] }
thiserror       = "2.0"
tracing         = "0.1"

# Profiling support (docs/performance_evaluation.md §7): bench builds keep
# debug symbols so `perf record`/flamegraph can resolve frames without changing
# the optimization level. `cargo build --profile profiling` gives the GUI/CLI a
# release-equivalent build with symbols for the same purpose.
[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = true

# The browser player's build (scripts/build-web.sh). Kept separate from
# `release` so tuning it cannot move a native benchmark baseline: `perf-bench.sh`
# and the Layer-3 drivers all build through `release`, and the web player is the
# one target whose frame cost is dominated by GPU work and whose CPU share is
# paid inside a wasm sandbox.
#
# `opt-level = "z"` keeps the served bundle small: pkg-slim 5.42 -> 4.18 MB,
# pkg-assets 6.54 -> 4.99 MB, pkg-full 27.96 -> 22.36 MB. The CPU share it can
# slow is 0.3–0.8 ms of a 3.5–4.1 ms browser frame, which is GPU-bound
# (docs/performance_evaluation.md §3.7).
# `lto = "fat"` + one codegen unit is what buys cross-crate inlining for the
# engine's evaluate/encode path; an A/B of those two settings could not separate
# frame time either, only artifact size.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
# Already the default for this target — `rustc --print cfg --target
# wasm32-unknown-unknown` reports panic="abort" — so this is a declaration, not
# a change. It is here so the profile does not silently acquire unwinding
# tables if that default is ever revised.
panic = "abort"

# Ship-only native profile. Kept separate from `release` so `perf-bench.sh` and
# the profiling drivers keep an unstripped, unwind-capable binary. Measured on
# the CLI: 54.79 MB unstripped -> 33.92 MB stripped at opt-level "z" (44.62 MB
# at opt-level 3); `panic = "abort"` + symbol stripping + fat LTO.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# vello 0.11.0 still reproduces upstream issue #1948 (the patchless-resolve
# variant of the persistent image-atlas bug first reported as #1558): a frame
# with no late-bound resources (no images, gradients or glyphs) resizes the
# persistent atlas to 1x1, and the next image frame samples a blank texture —
# exactly our multi-scope filter pipeline. Upstream fix PR #1664 is approved but
# still unmerged/conflicting. `vendor/vello` is unmodified 0.11.0 except for
# `src/render.rs`: an image-free render keeps the existing atlas alive instead of
# freeing/replacing it. Drop this patch (and the vendored directory) when a
# release contains #1664.
[patch.crates-io]
vello = { path = "vendor/vello" }
