library = "../../target/debug/libanimatix_plugin_demo.so"

[[primitives]]
type_name = "Pulse"
display_name = "Pulse"
category = "Shapes"
icon_id = "extension:pulse"
vector_paths = true
properties = ["glow", "mode", "caption", "pulse_origin", "image_url"]

[[properties]]
actor_type = "Pulse"
name = "glow"
type = "Num"
injectable = true
display_name = "Glow"
group = "Pulse"
help = "Pulse radius glow amount (0..1)"

[[properties]]
actor_type = "Pulse"
name = "mode"
type = "Enum(ring, dot, cross)"
injectable = true
display_name = "Mode"
group = "Pulse"
help = "Render variant: ring outline, filled dot, or crosshair"

[[properties]]
actor_type = "Pulse"
name = "caption"
type = "Str"
injectable = true
display_name = "Caption"
group = "Pulse"
help = "Label rendered below the pulse"

[[properties]]
actor_type = "Pulse"
name = "pulse_origin"
type = "Vec2"
injectable = true
display_name = "Origin"
group = "Pulse"
help = "Local offset of the pulse center from the actor position"

[[properties]]
actor_type = "Pulse"
name = "image_url"
type = "Str"
display_name = "Image URL"
group = "Pulse"
help = "Optional cached image URL stamped over the pulse"

[[callables]]
namespace = "demo"
name = "throb"
return_type = "Timeline"
phase = "Build"
category = "Effects"
help = "Return a local glow pulse plan for one Pulse actor."

[[callables.params]]
name = "target"
type = "Actor"
help = "Pulse actor to animate."

[[callables.params]]
name = "duration"
type = "Duration"
default = 0.5
optional = true
help = "Plan duration in seconds."

[[callables.params]]
name = "strength"
type = "Num"
default = 1.0
optional = true
help = "Peak glow reached by the throb."

[[callables]]
namespace = "demo"
name = "scale"
return_type = "Num"
phase = "BuildAndFrame"
category = "Math"
help = "Returns value multiplied by factor."

[[callables.params]]
name = "value"
type = "Num"
help = "Number to scale."

[[callables.params]]
name = "factor"
type = "Num"
help = "Scale factor."

[[services]]
name = "demo.pulse"
type = "usize"
help = "Demo native service value"

[[effects]]
name = "Pixelate"
display_name = "Pixelate"

[[effects.params]]
name = "size"
type = "Num"
