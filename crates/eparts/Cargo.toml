[package]
name = "eparts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Reusable egui widgets and design tokens extracted from Animatix."

[dependencies]
egui          = { workspace = true }
egui-phosphor = { workspace = true }
serde         = { workspace = true, optional = true }
serde_json    = { version = "1", optional = true }
thiserror     = { workspace = true, optional = true }
notify        = { version = "7.0.0", default-features = false, features = ["macos_fsevent"], optional = true }
tracing       = { workspace = true, optional = true }

[dev-dependencies]
# For the `gallery` example binary only (visual showcase + manual visual test).
# Does not affect consumers of the library.
eframe        = { workspace = true }
tempfile      = "3"

# wgpu-hal 29 (pulled in by the eframe→wgpu dev-dependency above) requests
# `windows-core` 0.62 with `default-features = false` and expects another crate
# in the graph to turn on `std` — that feature is what provides
# `impl core::error::Error for windows_core::Error`. `gpu-allocator` used to do
# that via `windows` 0.62 with default features, but the resolver unified it onto
# `windows` 0.54 (shared with `cpal`) when the hybrid-bench crate entered the
# graph, so on Windows `wgpu-hal`'s WGL (gles) backend stopped compiling
# (`windows_core::Error: core::error::Error` unsatisfied). Enabling `std`
# explicitly makes this dev/test build independent of that unification. Remove
# when wgpu-hal requests `windows-core/std` itself (29.0.2 still does not).
[target.'cfg(windows)'.dev-dependencies]
windows-core  = { version = "0.62", default-features = false, features = ["std"] }

[features]
# Default: tokens + traits + all current core widgets. These depend only on
# egui + egui-phosphor, so the default build stays dependency-light.
default = []

theme-json = ["dep:serde", "dep:serde_json", "dep:thiserror", "dep:notify", "dep:tracing"]
