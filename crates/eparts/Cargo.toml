[package]
name = "eparts"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reusable egui widgets and design tokens extracted from Animatix."

[dependencies]
egui          = { workspace = true }
egui-phosphor = { workspace = true }
serde         = { workspace = true, optional = true }
serde_json    = { version = "1", optional = true }
thiserror     = { workspace = true, optional = true }
notify        = { version = "7.0.0", default-features = false, features = ["macos_fsevent"], optional = true }
tracing       = { workspace = true, optional = true }

[dev-dependencies]
# For the `gallery` example binary only (visual showcase + manual visual test).
# Does not affect consumers of the library.
eframe        = { workspace = true }

[features]
# Default: tokens + traits + all current core widgets. These depend only on
# egui + egui-phosphor, so the default build stays dependency-light.
default = []

# ── Archived feature seams (docs/plans/eparts-refinement-roadmap.md §6.X). ──
# These remain empty by design and are not scheduled. Re-open one only when a
# concrete consumer exists; `theme-json` is delivered and active.
#
# table      : data-table widget (would add egui_extras)
# charts     : chart/plot widgets
# webview    : embedded web content
# i18n       : localization hooks (would add rust-i18n)
# unstable   : experimental APIs not yet covered by semver
theme-json = ["dep:serde", "dep:serde_json", "dep:thiserror", "dep:notify", "dep:tracing"]
table = []
charts = []
webview = []
i18n = []
unstable = []
