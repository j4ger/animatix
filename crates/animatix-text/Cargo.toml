[package]
name = "animatix-text"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
animatix-core = { path = "../animatix-core" }
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap", "fontconfig"] }
kurbo = { workspace = true }
ttf-parser = "0.25.1"
typst = "0.15.1"
tracing = { workspace = true }
typst-layout = "0.15.1"
# Reused (same version/features as typst-library) to tokenize Code bodies with
# typst's own `raw` syntax set + theme, so highlighting matches typst exactly.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "plist-load", "yaml-load"] }
