[package]
name = "animatix-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rich-text", "image-decode", "svg", "raster-encode"]
# Optional compilation switches; the shipped SDK includes all capabilities
# and loads their Wasm partitions on demand.
rich-text = ["animatix/rich-text"]
image-decode = ["animatix/image-decode"]
svg = ["animatix/svg"]
raster-encode = ["animatix-render/raster-encode"]

[dependencies]
animatix = { path = "../animatix", default-features = false }
animatix-core = { path = "../animatix-core" }
animatix-syntax = { path = "../animatix-syntax" }
animatix-std = { path = "../animatix-std" }
serde = { workspace = true }
url = "2.5"
sha2 = "0.10.9"
# Dropped/invalid values log through `tracing`, never `println!` (Code Style).
# The browser has no subscriber, so a `warn!` here serves native tests and any
# host that installs one; the wasm boundary additionally reports drops to JS by
# returning the accepted count from `AmxPlayer::set_vars`.
tracing = { workspace = true }

[dev-dependencies]
# Native host tests exercise the full text pipeline; wasm packages built for
# the web load the external font pack instead of embedding these bytes.
animatix = { path = "../animatix", features = ["bundled-fonts"] }

# Web-only stack. The cdylib target is wasm32-unknown-unknown; native builds
# compile the pure host-side modules (parse/build pipeline + DTOs) for the
# workspace test gates and skip everything below.
[target.'cfg(target_arch = "wasm32")'.dependencies]
animatix-render = { path = "../animatix-render", default-features = false }
console_error_panic_hook = "0.1"
js-sys = "0.3"
kurbo = { workspace = true }
serde-wasm-bindgen = "0.6"
# Shared vello version (see the comment on the workspace entry).
vello = { workspace = true }
# Pinned to the installed wasm-bindgen-cli version; a mismatch fails at
# `wasm-bindgen` glue generation time. futures 0.4.78 is the line that pins
# the same wasm-bindgen version.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Performance", "Window", "console"] }
# `webgpu` selects the browser backend (native builds select vulkan/metal/...),
# `fragile-send-sync-non-atomic-wasm` is required because wgpu types are
# !Send on non-atomic wasm32 and the engine stores them in single-threaded
# driver structs.
wgpu = { workspace = true, features = ["webgpu", "fragile-send-sync-non-atomic-wasm"] }
