[package]
name = "animatix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
# Rendering, text, and SVG are part of the engine, not options: the build and
# evaluate paths construct `vello::Scene`s, compile text, and parse SVG
# unconditionally, and the `FilterBackend` seam is typed in `wgpu`/`vello`
# (the GPU *presentation* stack lives in `animatix-render`). Modelling them as
# features produced `#[cfg(not(feature = ...))]` branches that no supported
# build could ever compile, so they were removed.
default = ["perf-tracing"]
# Shared stage tracing (`crate::perf`, PF-8). Default-on so benches and the GUI
# HUD measure the same stages; compile out with --no-default-features to
# eliminate the (already tiny) hot-path cost.
perf-tracing = []
serde = ["dep:serde", "animatix-syntax/serde", "animatix-core/serde"]
plugin-loading = ["dep:animatix-plugin-api", "dep:libloading"]

[dependencies]
animatix-core = { path = "../animatix-core" }
animatix-text = { path = "../animatix-text" }
animatix-std = { path = "../animatix-std" }
animatix-plugin-api = { path = "../animatix-plugin-api", optional = true }
animatix-syntax = { path = "../animatix-syntax" }
libloading = { version = "0.8", optional = true }
serde = { workspace = true, optional = true }
fastrand = "2.4"
image = { workspace = true, features = ["png", "gif", "jpeg", "webp"] }
kurbo = { workspace = true }
roxmltree = { version = "0.20.0" }

typst = { version = "0.15.1" }
usvg = { version = "0.47.0" }
# Pinned pre-#1558 (atlas residency): that change makes image draws vanish
# when a non-image vello render runs between two image renders — fatal for
# our multi-scope filter pipeline (see tests/vello_img_probe.rs). Revisit on
# an upstream fix.
vello = { git = "https://github.com/linebender/vello", rev = "d8686d52", default-features = false, features = ["wgpu"] }
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
taffy = { version = "0.10", default-features = false, features = ["flexbox", "grid", "std", "taffy_tree"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The export-path drivers (`examples/export_*.rs`) drive the GPU stack, which
# lives in `animatix-render`. Dev-dependency cycles are allowed by Cargo and
# only the example/bench targets use this edge, so engine unit tests never mix
# the two builds of `animatix`.
animatix-render = { path = "../animatix-render" }
chumsky = "0.12.0"
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"
serde_json = "1"

[[bench]]
name = "timeline_eval"
harness = false

