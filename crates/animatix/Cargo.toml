[package]
name = "animatix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The six merged targets below are the only bench targets; the original
# per-suite files are `mod`ules of them. Without this, Cargo would also
# build each suite file as a target of its own.
autobenches = false

[features]
# Rendering, text, and SVG are part of the engine, not options: the build and
# evaluate paths construct `vello::Scene`s, compile text, and parse SVG
# unconditionally, and the `FilterBackend` seam is typed in `wgpu`/`vello`
# (the GPU *presentation* stack lives in `animatix-render`). Modelling them as
# features produced `#[cfg(not(feature = ...))]` branches that no supported
# build could ever compile, so they were removed.
default = ["perf-tracing", "rich-text", "image-decode", "svg", "bundled-fonts"]
# Rich text (Typst markup / Code highlighting / Math). Off in the slim
# playback-only web profile; Text falls back to the plain fast path.
rich-text = ["animatix-text/rich-text"]
# Native builds embed the vendored font bytes. Web builds disable this and
# load the external font pack instead.
bundled-fonts = ["animatix-text/bundled-fonts"]
# Raster image decoding (PNG/JPEG/WebP/GIF files referenced by scenes).
image-decode = ["dep:image"]
# SVG asset loading and the SVG->AST import path.
svg = ["dep:usvg"]
# Shared stage tracing (`crate::perf`, PF-8). Default-on so benches and the GUI
# HUD measure the same stages; compile out with --no-default-features to
# eliminate the (already tiny) hot-path cost.
perf-tracing = []
serde = ["dep:serde", "animatix-syntax/serde", "animatix-core/serde", "kurbo/serde"]
plugin-loading = ["dep:animatix-plugin-api", "dep:libloading"]

[dependencies]
animatix-core = { path = "../animatix-core" }
# default-features = false: rich text is opt-in via the engine's own
# `rich-text` feature (slim playback builds compile without the Typst stack).
animatix-text = { path = "../animatix-text", default-features = false }
animatix-std = { path = "../animatix-std" }
animatix-plugin-api = { path = "../animatix-plugin-api", optional = true }
animatix-syntax = { path = "../animatix-syntax" }
libloading = { version = "0.8", optional = true }
serde = { workspace = true, optional = true }
fastrand = "2.4"
image = { workspace = true, features = ["png", "gif", "jpeg", "webp"], optional = true }
kurbo = { workspace = true }
roxmltree = { version = "0.20.0" }
smallvec = "1"

typst = { version = "0.15.1" }
usvg = { version = "0.47.0", optional = true }
# Vello 0.11 (crates.io). Upstream #1558 (image-atlas residency) is fixed in
# vello 0.9.0; `tests/vello_img_probe.rs` still asserts the A–H matrix.
vello = { workspace = true }
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
taffy = { version = "0.10", default-features = false, features = ["flexbox", "grid", "std", "taffy_tree"] }
thiserror = { workspace = true }
tracing = { workspace = true }
unicode-general-category = "1.1.0"
unicode-segmentation = "1.13.2"

[dev-dependencies]
# The export-path drivers (`examples/export_*.rs`) drive the GPU stack, which
# lives in `animatix-render`. Dev-dependency cycles are allowed by Cargo and
# only the example/bench targets use this edge, so engine unit tests never mix
# the two builds of `animatix`.
animatix-render = { path = "../animatix-render" }
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"
serde_json = "1"

# Six semantic targets; each is a wrapper over the original per-suite files in
# `benches/`, which stay `mod`ules so benchmark IDs and groups do not change.
[[bench]]
name = "build"
harness = false

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "stage"
harness = false

[[bench]]
name = "vm"
harness = false

[[bench]]
name = "text"
harness = false

[[bench]]
name = "gpu"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm_split = { workspace = true }
