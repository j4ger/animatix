[package]
name = "animatix-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LSP server for Animatix DSL — provides language intelligence to external editors"

[[bin]]
name = "animatix-lsp"
path = "src/main.rs"

[dependencies]
animatix-analyzer = { path = "../animatix-analyzer" }
animatix-syntax = { path = "../animatix-syntax" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
url = "2"
