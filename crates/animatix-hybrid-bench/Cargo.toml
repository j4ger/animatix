[package]
name = "animatix-hybrid-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Demo/benchmark only: builds a wasm cdylib that renders the same synthetic
# vector scene through two backends so a browser page can compare frame cost.
# Not part of the engine, the player, or any shipped artifact. Every dependency
# is wasm32-only so `cargo check --workspace` on a native host builds an empty
# lib instead of pulling vello_hybrid's WebGL path.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Production compute path: RendererCore (vello Renderer + fullscreen blit).
animatix-render = { path = "../animatix-render", default-features = false }
vello = { git = "https://github.com/linebender/vello", rev = "d8686d52", default-features = false, features = ["wgpu"] }
# WebGL2 backend. libm (not std) so the crate stays no_std and does not pull
# vello_hybrid's own `wgpu` feature (which conflicts with `webgl`).
vello_hybrid = { git = "https://github.com/linebender/vello", rev = "d8686d52", default-features = false, features = ["webgl", "libm"] }
wgpu = { workspace = true, features = ["webgpu", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window",
  "Performance",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "console",
] }
