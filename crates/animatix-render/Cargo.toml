[package]
name = "animatix-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
default = ["raster-encode"]
video = ["dep:rsmpeg"]
# Single-frame PNG/WebP raster export. Off in the slim web profile (no
# export path is reachable there).
raster-encode = ["dep:image"]

[dependencies]
# default-features = false so a wasm build of this crate does not force
# `perf-tracing` (std `Instant` panics on wasm32) into the engine. Full
# native builds re-enable it through the GUI/CLI crates' own `animatix`
# dependency, so stage tracing behaviour is unchanged there.
animatix = { path = "../animatix", default-features = false }
animatix-core = { path = "../animatix-core" }
animatix-syntax = { path = "../animatix-syntax" }
kurbo = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true, features = ["png", "gif", "jpeg", "webp"], optional = true }
pollster = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
# Pinned pre-#1558 (atlas residency): that change makes image draws vanish
# when a non-image vello render runs between two image renders — fatal for
# our multi-scope filter pipeline. The gate is tests/vello_img_probe.rs, which
# now asserts its A–H matrix. Probed 2026-10-04 against upstream main
# (f3000c8d): the probe could not run there at all, because that vello builds
# against wgpu 30 while this workspace pins 29 (`[workspace.dependencies]
# wgpu`). The pin therefore lifts with a wgpu 29→30 bump, not with a rev change;
# whether upstream has since fixed the residency regression is still unmeasured.
vello = { git = "https://github.com/linebender/vello", rev = "d8686d52", default-features = false, features = ["wgpu"] }
rsmpeg = { version = "0.18.0", default-features = false, features = ["ffmpeg8", "link_system_ffmpeg"], optional = true }
