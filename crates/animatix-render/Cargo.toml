[package]
name = "animatix-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["raster-encode"]
video = ["dep:rsmpeg"]
# Single-frame PNG/WebP raster export. Off in the slim web profile (no
# export path is reachable there).
raster-encode = ["dep:image"]

[dependencies]
# default-features = false so a wasm build of this crate does not force
# `perf-tracing` (std `Instant` panics on wasm32) into the engine. Full
# native builds re-enable it through the GUI/CLI crates' own `animatix`
# dependency, so stage tracing behaviour is unchanged there.
animatix = { path = "../animatix", default-features = false }
animatix-core = { path = "../animatix-core" }
animatix-syntax = { path = "../animatix-syntax" }
kurbo = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true, features = ["png", "gif", "jpeg", "webp"], optional = true }
pollster = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
# Vello 0.11 (crates.io). Upstream #1558 (image-atlas residency) is fixed in
# vello 0.9.0; `tests/vello_img_probe.rs` still asserts the A–H matrix.
vello = { workspace = true }
rsmpeg = { version = "0.18.0", default-features = false, features = ["ffmpeg8", "link_system_ffmpeg"], optional = true }

[dev-dependencies]
animatix = { path = "../animatix", features = ["image-decode"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm_split = { workspace = true }
