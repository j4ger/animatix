[package]
name = "animatix-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "animatix-gui"

[features]
default = ["plugin-loading"]
# Enables the bounded widget-screenshot binary. Never enable in shipped binaries.
dev-screenshots = ["dep:image"]
video = ["animatix-render/video"]
plugin-loading = ["animatix/plugin-loading"]
# Enables eparts JSON theme loading, registries, and live directory watching.
theme-json = ["eparts/theme-json"]

[dependencies]
animatix = { path = "../animatix" }
animatix-render = { path = "../animatix-render" }
animatix-analyzer = { path = "../animatix-analyzer" }
animatix-i18n = { path = "../animatix-i18n" }
animatix-plugin-tooling = { path = "../animatix-plugin-tooling" }
animatix-syntax = { path = "../animatix-syntax" }
eparts = { path = "../eparts" }
crossbeam-channel = "0.5"
dark-light = "2.0"
directories = "6.0.0"
eframe = { workspace = true }
egui = { workspace = true, features = ["serde"] }
egui_tiles = { workspace = true }
egui-phosphor = { workspace = true }
hound = "3.5"
image = { workspace = true, features = ["png"], optional = true }
kurbo = { workspace = true }
ron = "0.12.0"
regex = "1"
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
notify = { version = "7.0.0", default-features = false, features = ["macos_fsevent"] }
rfd = "0.15"
rodio = "0.20"
redb = "5.0.0"
# Preview decodes AAC and ISO BMFF directly so the demuxer can seek on a File.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3"] }
# eframe's wgpu feature selects the desktop backend defaults.
wgpu = { workspace = true }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "widget-screenshot"
path = "src/bin/widget-screenshot.rs"
required-features = ["dev-screenshots"]

[build-dependencies]
# Also available on non-Windows hosts for Windows cross-compilation.
winresource = { version = "0.1.34", default-features = false }
