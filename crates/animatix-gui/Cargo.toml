[package]
name = "animatix-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
animatix = { path = "../animatix" }
directories = "6.0.0"
egui = { version = "=0.33.3", features = ["serde"] }
egui_extras = { version = "=0.33.3", features = ["syntect"] }
egui-winit = "=0.33.3"
egui_dock = { version = "=0.18.0", features = ["serde"] }
egui_wgpu_backend = "=0.36.0"
pollster = "0.4.0"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
syntect = { version = "5.3.0", features = ["default-fancy", "yaml-load"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }
notify = { version = "7.0.0", default-features = false, features = ["macos_fsevent"] }
wgpu = "28.0.0"
winit = "0.30.13"
