[package]
name = "animatix-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
animatix = { path = "../animatix" }
directories = "6.0.0"
egui = { version = "=0.33.3", features = ["serde"] }
egui-winit = "=0.33.3"
egui_code_editor = "=0.2.20"
egui_dock = { version = "=0.18.0", features = ["serde"] }
egui_wgpu_backend = "=0.36.0"
pollster = "0.4.0"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }
wgpu = "28.0.0"
winit = "0.30.13"
