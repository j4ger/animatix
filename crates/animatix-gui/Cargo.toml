[package]
name = "animatix-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "animatix-gui"

[features]
default = ["plugin-loading"]
# Enables the bounded widget-screenshot binary. Never enable in shipped binaries.
dev-screenshots = ["dep:image"]
video = ["animatix/video"]
plugin-loading = ["animatix/plugin-loading"]
# Enables eparts JSON theme loading, registries, and live directory watching.
theme-json = ["eparts/theme-json"]

[dependencies]
animatix = { path = "../animatix" }
animatix-analyzer = { path = "../animatix-analyzer" }
animatix-plugin-tooling = { path = "../animatix-plugin-tooling" }
animatix-syntax = { path = "../animatix-syntax" }
eparts = { path = "../eparts" }
crossbeam-channel = "0.5"
dark-light = "2.0"
directories = "6.0.0"
eframe = { workspace = true }
egui = { workspace = true, features = ["serde"] }
egui_code_editor = { workspace = true }
egui_extras = { workspace = true }
egui_tiles = { workspace = true }
egui-phosphor = { workspace = true }
image = { workspace = true, features = ["png"], optional = true }
kurbo = { workspace = true }
ron = "0.12.0"
serde = { workspace = true }
serde_json = "1"
syntect = { version = "5.3.0", features = ["default-fancy", "yaml-load"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
notify = { version = "7.0.0", default-features = false, features = ["macos_fsevent"] }
rfd = "0.15"
rodio = "0.20"
wgpu = { workspace = true, default-features = true }

[[bin]]
name = "widget-screenshot"
path = "src/bin/widget-screenshot.rs"
required-features = ["dev-screenshots"]

[dev-dependencies]
chumsky = "0.12"
