[package]
name = "animatix-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Animatix command-line renderer and scene checker"

[features]
default = []
video = ["animatix/video"]

[dependencies]
animatix = { path = "../animatix" }
animatix-analyzer = { path = "../animatix-analyzer" }
animatix-syntax = { path = "../animatix-syntax" }
clap = { version = "4.5.0", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[[bin]]
name = "animatix"
path = "src/main.rs"
