[package]
name = "animatix-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared language intelligence for Animatix DSL — completions, diagnostics, hover, go-to-definition"

[dependencies]
animatix-syntax = { path = "../animatix-syntax" }
chumsky = "0.12"
tree-sitter = "0.26"
tree-sitter-animatix = { path = "../tree-sitter-animatix" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
